<!doctype html>
<!--
  Drives the REAL WebGPURenderer (shaders, pipelines, state texture, pick pass)
  against an offscreen texture in place of the canvas swap chain, then reads
  the pixels back. Exists because headless SwiftShader Chromium cannot present
  a WebGPU canvas at all (presenting drops the GPU instance -- reproduced with a
  10-line snippet and no viewer code), so the viewer page cannot be graded
  there. Everything but the final present is the shipped code path.

  ?src=<cadmesh relative to this page>, ?n=<picks per class>,
  ?mutate=noreverse (mutation control for the depth check). Publishes <pre id="selftest">.
-->
<html><head><meta charset="utf-8"><title>webgpu offscreen selftest</title></head>
<body>
<script type="module">
// Imported dynamically INSIDE run(): a static import that fails to load (a
// 5xx from the server) kills the whole module silently, and the harness then
// sees no SELFTEST line at all instead of the reason.
const W = 640, H = 400;
const BG = [0.114, 0.129, 0.153];
const out = { status: 'error', backend: 'webgpu-offscreen' };

const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(...a) || 1; return a.map((v) => v / l); };

// Nearest triangle along eye + t*dir (Moller-Trumbore, both faces):
// { t, id (mesh index + 1, from the vertex id bytes), second (nearest t of
// any OTHER body) } or null.
function rayCast(mesh, o, d) {
  const P = mesh.position, I = mesh.index, ID = mesh.id;
  let best = Infinity, bestId = 0, second = Infinity;
  for (let i = 0; i < I.length; i += 3) {
    const a = I[i] * 3, b = I[i + 1] * 3, cc = I[i + 2] * 3;
    const e1x = P[b] - P[a], e1y = P[b + 1] - P[a + 1], e1z = P[b + 2] - P[a + 2];
    const e2x = P[cc] - P[a], e2y = P[cc + 1] - P[a + 1], e2z = P[cc + 2] - P[a + 2];
    const px = d[1] * e2z - d[2] * e2y, py = d[2] * e2x - d[0] * e2z, pz = d[0] * e2y - d[1] * e2x;
    const det = e1x * px + e1y * py + e1z * pz;
    if (Math.abs(det) < 1e-20) continue;
    const inv = 1 / det;
    const sx = o[0] - P[a], sy = o[1] - P[a + 1], sz = o[2] - P[a + 2];
    const u = (sx * px + sy * py + sz * pz) * inv;
    if (u < 0 || u > 1) continue;
    const qx = sy * e1z - sz * e1y, qy = sz * e1x - sx * e1z, qz = sx * e1y - sy * e1x;
    const v = (d[0] * qx + d[1] * qy + d[2] * qz) * inv;
    if (v < 0 || u + v > 1) continue;
    const t = (e2x * qx + e2y * qy + e2z * qz) * inv;
    if (t <= 0) continue;
    const vi = I[i] * 4;
    const id = ID[vi] | (ID[vi + 1] << 8) | (ID[vi + 2] << 16);
    if (t < best) {
      if (id !== bestId) second = best;
      best = t; bestId = id;
    } else if (id !== bestId && t < second) {
      second = t;
    }
  }
  return bestId ? { t: best, id: bestId, second } : null;
}

async function run() {
  const { decodeCadmesh } = await import('../js/cadmesh.js');
  const { WebGPURenderer } = await import('../js/renderer-webgpu.js');
  const { lookAt, multiply, perspective } = await import('../js/mat4.js');
  const src = new URLSearchParams(location.search).get('src');
  if (!src) throw new Error('pass ?src=<.cadmesh url>');
  const mesh = decodeCadmesh(await (await fetch(src)).arrayBuffer());
  if (!navigator.gpu) throw new Error('no WebGPU adapter');
  const adapter = await Promise.race([navigator.gpu.requestAdapter(),
    new Promise((_, rej) => setTimeout(() => rej(new Error('requestAdapter timed out')), 6000))]);
  if (!adapter) throw new Error('no WebGPU adapter');
  const device = await adapter.requestDevice();
  const format = navigator.gpu.getPreferredCanvasFormat();
  const target = device.createTexture({ size: [W, H], format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const fakeCtx = { configure() {}, getCurrentTexture: () => target };
  const canvas = { width: W, height: H };
  const r = new WebGPURenderer(canvas, adapter, device, fakeCtx);
  await r.upload(mesh);
  r.setState(new Uint8Array(1024 * 4), 1024, 1);

  // ?mutate=noreverse: a deliberately non-reversed matrix, to prove the ray-cast
  // check below can fail (it must report raycastPicks well under 90%)
  const reverse = new URLSearchParams(location.search).get('mutate') === 'noreverse' ? false : r.reverseZ;
  const b = mesh.header.bbox;
  const c = [0, 1, 2].map((k) => (b.min[k] + b.max[k]) / 2);
  const rad = Math.hypot(...[0, 1, 2].map((k) => b.max[k] - b.min[k])) / 2;
  const dist = rad / Math.sin(Math.PI / 8) * 1.05;
  const eye = [c[0] + dist * 0.6, c[1] + dist * 0.4, c[2] + dist * 0.7];
  const frame = {
    viewProj: multiply(perspective(Math.PI / 4, W / H, dist - rad * 2 > 0 ? dist - rad * 2 : rad * 0.01, dist + rad * 2.5, true, reverse), lookAt(eye, c, [0, 1, 0])),
    eye, light: [0.4, 0.8, 0.5], clip: null, highlight: [1, 0.55, 0.1, 1], background: BG,
  };
  r.render(frame);

  // read the shaded frame back and count pixels that are not background
  const bpr = Math.ceil((W * 4) / 256) * 256;
  const rb = device.createBuffer({ size: bpr * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder();
  enc.copyTextureToBuffer({ texture: target }, { buffer: rb, bytesPerRow: bpr }, [W, H]);
  device.queue.submit([enc.finish()]);
  await rb.mapAsync(GPUMapMode.READ);
  const px = new Uint8Array(rb.getMappedRange());
  const bg = BG.map((v) => Math.round(v * 255));
  const lit = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const o = y * bpr + x * 4;
      // format may be bgra8unorm or rgba8unorm: compare as a set
      const d = Math.abs(px[o] - bg[0]) + Math.abs(px[o + 1] - bg[1]) + Math.abs(px[o + 2] - bg[2]);
      const d2 = Math.abs(px[o + 2] - bg[0]) + Math.abs(px[o + 1] - bg[1]) + Math.abs(px[o] - bg[2]);
      lit[y * W + x] = Math.min(d, d2) > 12 ? 1 : 0;
    }
  }
  rb.unmap();
  // The pick pass must agree with the shaded pass: sampled pixels the shade
  // pass lit must pick a body, background pixels must pick 0. Only pixels whose
  // whole 3x3 neighbourhood agrees are sampled: an edge pixel can differ by
  // MSAA coverage, which is not a pick bug.
  const litPx = [];
  const darkPx = [];
  let litCount = 0;
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      let s = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += lit[(y + dy) * W + x + dx];
      litCount += lit[y * W + x];
      if (s === 9) litPx.push([x, y]);
      else if (s === 0) darkPx.push([x, y]);
    }
  }
  const interior = litPx;
  // each pick is a full draw: on a software adapter a big model wants a small n
  const N = Math.max(1, Number(new URLSearchParams(location.search).get('n')) || 32);
  const sample = (arr) => Array.from({ length: Math.min(N, arr.length) }, (_, i) => arr[Math.floor((i * arr.length) / Math.min(N, arr.length))]);
  const litIds = [];
  // pick resolves to { id, mesh }; mesh must be the model uploaded above
  const pickAt = async (x, y) => {
    const res = await r.pick(x, y, frame);
    if (!res || res.mesh !== mesh) throw new Error('pick answered about a different mesh');
    return res.id;
  };
  for (const [x, y] of sample(interior)) litIds.push(await pickAt(x, y));
  const darkIds = [];
  for (const [x, y] of sample(darkPx)) darkIds.push(await pickAt(x, y));
  // Concurrent picks (a click landing while a hover pick is still mapping) must
  // all get the real answer -- review r1: a refused pick used to return 0.
  let concurrentOk = null;
  if (interior.length) {
    const [cx, cy] = interior[Math.floor(interior.length / 2)];
    const ans = await Promise.all([0, 1, 2, 3].map(() => pickAt(cx, cy)));
    concurrentOk = ans.every((id) => id > 0 && id === ans[0]);
    out.concurrentPicks = ans;
  }
  // Depth test ground truth: a CPU ray cast through each sampled lit pixel
  // must name the same (nearest) body as the GPU pick. A broken depth setup
  // (e.g. reverse-Z with a non-reversed matrix: last-drawn wins) still lights
  // and picks consistently, so lit/pick agreement alone cannot catch it.
  // Hits whose two nearest bodies are within a hair are ambiguous and skipped.
  const fwd = norm(c.map((v, k) => v - eye[k]));
  const right = norm(cross(fwd, [0, 1, 0]));
  const upv = cross(right, fwd);
  const th = Math.tan(Math.PI / 8);
  let rayAgree = 0, rayN = 0;
  const litSample = sample(interior);
  for (let i = 0; i < litSample.length; i++) {
    const [x, y] = litSample[i];
    const nx = ((x + 0.5) / W) * 2 - 1, ny = 1 - ((y + 0.5) / H) * 2;
    const dir = fwd.map((v, k) => v + right[k] * nx * th * (W / H) + upv[k] * ny * th);
    const hit = rayCast(mesh, eye, dir);
    if (!hit || hit.second - hit.t < rad * 1e-5) continue;
    rayN++;
    if (hit.id === litIds[i]) rayAgree++;
  }
  out.raycastPicks = `${rayAgree}/${rayN}`;
  // measured: correct depth 32/32 and 8/8 on two test assemblies; the noreverse
  // mutation 11/16 and 7/16
  const rayOk = rayN > 0 && rayAgree >= 0.9 * rayN;
  const litHits = litIds.filter((id) => id > 0).length;
  const darkHits = darkIds.filter((id) => id > 0).length;
  const pickId = litIds.find((id) => id > 0) || 0;
  Object.assign(out, {
    status: 'ready', format, adapter: r.adapterInfo, litFraction: +(litCount / (W * H)).toFixed(3),
    litPicks: `${litHits}/${litIds.length}`, backgroundPicks: `${darkHits}/${darkIds.length}`,
    distinctBodies: new Set(litIds.filter((id) => id > 0)).size,
    concurrentOk,
    pickId: litIds.length && litHits === litIds.length && darkHits === 0 && concurrentOk && rayOk ? pickId : 0,
    pickName: pickId ? mesh.header.meshes[pickId - 1].name : null,
    stats: { meshes: mesh.header.meshes.length, triangles: mesh.header.indexCount / 3 },
  });
}

run().catch((e) => { out.error = String(e.message || e); }).finally(() => {
  const pre = document.createElement('pre');
  pre.id = 'selftest';
  pre.textContent = `SELFTEST ${JSON.stringify(out)}`;
  document.body.append(pre);
});
</script>
</body></html>
